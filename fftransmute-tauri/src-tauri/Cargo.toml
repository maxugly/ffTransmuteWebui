[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# custom-protocol = prod build: embeds frontendDist assets and ignores devUrl.
# Plain `cargo build --release` WITHOUT this feature produces a dev-mode
# binary whose window navigates straight to devUrl and shows a white
# "Connection refused" page. Always build with this feature (the tauri CLI
# adds it automatically for `tauri build`).
tauri = { version = "2.12.5", features = ["custom-protocol"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
libc = "0.2"
