<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>ffTransmute</title>
<style>
  body{background:#111;color:#ddd;font-family:sans-serif;display:flex;
       align-items:center;justify-content:center;height:100vh;margin:0}
  #s{font-size:14px}
</style>
</head>
<body>
<div id="s">Starting server…</div>
<script>
  // Poll the embedded server until it responds, then navigate the webview
  // to it. This avoids the startup race (server boots in ~3s; a direct
  // window URL would hit "Connection refused" and never retry).
  var target = "http://127.0.0.1:24590/";
  var s = document.getElementById('s');
  function tryLoad() {
    fetch(target, { mode: 'no-cors' })
      .then(function () { window.location.href = target; })
      .catch(function () {
        s.textContent = "Waiting for server on 24590…";
        setTimeout(tryLoad, 400);
      });
  }
  setTimeout(tryLoad, 300);
</script>
</body>
</html>
